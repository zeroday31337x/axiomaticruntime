name: Publish Axiomatic Runtime 1.0.0 to AWS Marketplace

on:
  push:
    branches:
      - 'marketplace-release/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::166044977986:role/GitHubActions-ZDXAxiomaticMarketplacePush
          aws-region: us-east-1

      - name: Login to AWS Marketplace ECR
        shell: bash
        run: |
          aws ecr get-authorization-token --region us-east-1 --registry-ids 709825985650 \
            --query 'authorizationData[0].authorizationToken' --output text \
            | base64 -d | cut -d: -f2- \
            | docker login --username AWS --password-stdin 709825985650.dkr.ecr.us-east-1.amazonaws.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push qualified Marketplace image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: native/Dockerfile
          platforms: linux/amd64
          push: true
          tags: 709825985650.dkr.ecr.us-east-1.amazonaws.com/zerodrivex/zerodrivex/zdx-axiomatic-runtime:1.0.0
          build-args: |
            ZDX_RELEASE_ID=axiomatic-v1.0.0
          sbom: true
          provenance: mode=max

      - name: Record immutable digest
        run: |
          echo "Marketplace image digest: ${{ steps.build.outputs.digest }}" | tee marketplace-image-digest.txt
          cat marketplace-image-digest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: axiomatic-marketplace-image-digest
          path: marketplace-image-digest.txt
          if-no-files-found: error
