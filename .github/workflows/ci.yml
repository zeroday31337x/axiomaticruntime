name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm test
      - run: npm run validate:profile
      - run: docker build -t axiomatic-runtime:test .
      - run: |
          TOKEN='ci-only-axiomatic-runtime-token-00000001'
          docker run -d --name ax -p 8080:8080 -e AXIOMATIC_RUNTIME_TOKEN="$TOKEN" axiomatic-runtime:test
          sleep 2
          curl --fail http://127.0.0.1:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/evaluate -H 'content-type: application/json' -d '{"proposal":{"kind":"reply","reply":"ok"}}')" = "401"
          curl --fail -X POST http://127.0.0.1:8080/v1/evaluate -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"proposal":{"kind":"reply","reply":"ok"}}' | grep '"decision":"RETAIN"'
          docker rm -f ax
