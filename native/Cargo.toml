[package]
name="axiomatic-runtime-native"
version="1.0.0"
edition="2024"
[features]
default=[]
marketplace=["dep:aws-config","dep:aws-sdk-licensemanager","dep:aws-smithy-types","dep:tokio","dep:ctrlc"]
dynamodb-claims=["dep:aws-config","dep:aws-sdk-dynamodb","dep:aws-smithy-types","dep:tokio"]
[dependencies]
serde={version="1",features=["derive"]}
serde_json={version="1",features=["preserve_order"]}
serde_jcs="0.1"
sha2="0.10"
hex="0.4"
ed25519-dalek={version="2",features=["pkcs8","pem","rand_core"]}
base64="0.22"
libc="0.2"
zeroize="1"
rand_core={version="0.6",features=["getrandom"]}
ctrlc={version="3",optional=true}
tiny_http="0.12"
subtle="2.6"
aws-config={version="1",default-features=false,features=["behavior-version-latest","default-https-client","rt-tokio"],optional=true}
aws-sdk-licensemanager={version="1",default-features=false,features=["behavior-version-latest","default-https-client","rt-tokio"],optional=true}
aws-sdk-dynamodb={version="1",default-features=false,features=["behavior-version-latest","default-https-client","rt-tokio"],optional=true}
aws-smithy-types={version="1",optional=true}
tokio={version="1",features=["rt-multi-thread","time"],optional=true}
uuid={version="1",features=["v4","serde"]}

[dev-dependencies]
tempfile="3"